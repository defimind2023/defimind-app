# guard-core on Fly.io (D3). Two listeners:
#   public,  0.0.0.0:8080 behind Fly's TLS: the agent routes /v1/agent/* and /health, nothing else.
#   private, the 6PN address :8787: the admin and bot routes, for the bot over
#            your-guard-core.internal. No Fly service exposes it.
# Deploy from the repository root with --dockerfile; the commands are in this package's README.
app = "your-guard-core"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "fly-local-6pn"
  PORT = "8787"
  PUBLIC_HOST = "0.0.0.0"
  PUBLIC_PORT = "8080"
  # Fly's proxy sets Fly-Client-IP to the real client and drops any the client sent.
  TRUST_FLY_CLIENT_IP = "true"
  DATABASE_URL = "file:/data/guard.db"
  LOG_LEVEL = "info"
  # Tokens, the RPC URL, SOLANA_CHAIN and the hot key come from `fly secrets import`. So does
  # BOT_URL, with BOT_TOKEN and BOT_WEBHOOK_SECRET, only when a Telegram bot runs (CR-017).

[mounts]
  source = "guard_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never stopped: the expiry sweep, the bot's approvals and the day's spend need it running.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
